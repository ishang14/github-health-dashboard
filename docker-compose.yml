# Local full-stack run:  docker compose up --build
#   client  -> http://localhost:8080
#   server  -> http://localhost:5000
#
# Config comes from ./server/.env  (copy server/.env.example first).
# To use a throwaway local MongoDB instead of Atlas:
#   docker compose --profile local-db up --build
#   and set MONGODB_URI=mongodb://mongo:27017/githealth in server/.env

services:
  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Origin the browser loads the client from (must match CORS).
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        # Baked into the static bundle. Point this at the PUBLIC URL of the
        # server as seen from the browser (not the compose service name).
        VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

  mongo:
    image: mongo:7
    profiles: ["local-db"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    restart: unless-stopped

volumes:
  mongo-data:
